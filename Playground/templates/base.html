{% load static %}

<!DOCTYPE html>
<html>
  <head>
	<title>{{title}}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">	  <link type="text/css" href="{% static 'SportsGrounds/css/styles.css' %}" rel="stylesheet" />
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<link rel="shortcut icon" href="{% static 'SportsGrounds/images/logo.png' %}" type="image/x-icon"/>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<header class="wrapper">
	<nav class="navbar bg-dark navbar-expand-lg bg-body-tertiary" data-bs-theme="dark">
	  <div class="container-fluid">
		<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
		  <span class="navbar-toggler-icon"></span>
		</button>
		<div class="collapse navbar-collapse" id="navbarNav">
		  <ul class="navbar-nav">
			  {% for n in navigation %}
				<li class="nav-item">
				  <a class="nav-link" href="{% url n.url_name %}">{{n.name}}</a>
				</li>
			  {% endfor %}
				  <ul class="login-logout">
					{% if user.is_authenticated %}
					  <li class="login-logout-form"><a href="{% url 'profile' %}">{{user.username}}</a>|
						<form method="post" action="{% url 'logout' %}">
							{% csrf_token %}
							<button class="btn" type="submit">Выйти</button>
						</form>
					</li>
					{% else %}
					<li><a href="{% url 'login' %}">Войти</a> | <a href="{% url 'register' %}">Регистрация</a></li>
					{% endif %}
				  </ul>
		  </ul>

		</div>
	  </div>
	</nav>
</header>
    <section class="wrapper-section">
	 {% block content %}
	 {% endblock %}
    </section>
<footer class="bg-primary text-center text-lg-start">
  <div class="text-center p-3" style="background-color: rgba(43, 48, 53, 1);">
    © 2024
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script></body>
</html>
