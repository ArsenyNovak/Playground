{% extends 'base.html' %}

{% block content %}
<div class="layout-column">
{% for item in categories %}
	<div class="card-categories" style="width: 20rem">
		<a href="{{item.get_absolute_url}}">
			<img class="categories-item-images" src="{{ item.image.url }}">
			<h3>{{ item.name }}</h3>
		</a>
	</div>
{% endfor %}
</div>
{% endblock %}
