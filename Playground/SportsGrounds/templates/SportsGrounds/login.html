{% extends 'base.html' %}

{% block content %}
<div class="show-sportground-section">
    <div class="card" style="width: 400px">
        <div class="card-body">
            <h3>Авторизация</h3>
            <hr>
            <form method="POST">
                {% csrf_token %}
                <div class="form-error">{{ form.non_field_errors }}</div>
                <br>
                {% for f in form %}
                <p><label class="form-label" for="{{ f.id_for_label }}">{{ f.label }}</label>{{ f }}</p>
                <div class="form-error">{{ f.errors }}</div>
                {% endfor %}
                <p class="login-button"><button type="submit">Войти</button></p>
            </form>
            <hr>
            <p><a href="{% url 'password_reset' %}">Забыли пароль?</a></p>
        </div>
    </div>
</div>

{% endblock %}
